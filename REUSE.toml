version = 1
SPDX-PackageName = "civil"
SPDX-PackageSupplier = "Weston Schmidt <weston_schmidt@alumni.purdue.edu>"
SPDX-PackageDownloadLocation = "https://github.com/schmidtw/civil"

[[annotations]]
path = ".golangci.yml"
precedence = "aggregate"
